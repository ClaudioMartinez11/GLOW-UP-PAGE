spring.application.name=glow-up-backend
server.port=8080

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/glow_up}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.hikari.data-source-properties.sslmode=${DATABASE_SSLMODE:require}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

google.sheets.spreadsheet-id=${GOOGLE_SHEETS_SPREADSHEET_ID:}
google.sheets.credentials-json=${GOOGLE_SERVICE_ACCOUNT_JSON:}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
